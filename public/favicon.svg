<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#050510"/>
    </linearGradient>
    
    <!-- Accent glow gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7aa2ff"/>
      <stop offset="50%" style="stop-color:#a27aff"/>
      <stop offset="100%" style="stop-color:#7aa2ff"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow for accent -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="4"/>
  
  <!-- Outer ring glow -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#7aa2ff" stroke-width="2" opacity="0.3" filter="url(#strongGlow)"/>
  
  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#7aa2ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Stars decoration -->
  <circle cx="120" cy="150" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="380" cy="120" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="350" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="100" cy="380" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="100" r="1.5" fill="#7aa2ff" opacity="0.8"/>
  <circle cx="350" cy="400" r="1.5" fill="#a27aff" opacity="0.6"/>
  
  <!-- K Letter -->
  <g filter="url(#glow)">
    <!-- K vertical bar -->
    <rect x="115" y="160" width="28" height="192" rx="4" fill="url(#accentGrad)"/>
    <!-- K diagonal top -->
    <polygon points="143,256 143,220 245,160 265,185 175,236" fill="url(#accentGrad)"/>
    <!-- K diagonal bottom -->
    <polygon points="143,256 143,292 245,352 265,327 175,276" fill="url(#accentGrad)"/>
  </g>
  
  <!-- L Letter -->
  <g filter="url(#glow)">
    <!-- L vertical bar -->
    <rect x="285" y="160" width="28" height="192" rx="4" fill="url(#accentGrad)"/>
    <!-- L horizontal bar -->
    <rect x="285" y="324" width="112" height="28" rx="4" fill="url(#accentGrad)"/>
  </g>
  
  <!-- Accent dot/orbit -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.15" stroke-dasharray="8 12"/>
  
  <!-- Corner accent marks -->
  <path d="M256 76 L256 56 M256 456 L256 436" stroke="#7aa2ff" stroke-width="2" opacity="0.5"/>
  <path d="M76 256 L56 256 M456 256 L436 256" stroke="#7aa2ff" stroke-width="2" opacity="0.5"/>
</svg>
